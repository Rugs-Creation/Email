<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rugs Email</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 3-pane mail client — app rail | folders + departments | message list | reading pane. Brand: Rugs Creation orange on ink */
:root{
  --bg:#f4f2f0; --pane:#ffffff; --pane2:#faf8f6; --fg:#191513; --muted:#77706a; --line:#ebe6e1; --hover:#f6efe9;
  --brand:#ff5001; --brand2:#fff0e6; --brandfg:#c23d00; --ink:#111010;
  --red:#d92d20; --redbg:#fdecea; --amber:#b86e00; --amberbg:#fff4dc; --green:#1f8a4c; --greenbg:#e5f6ec; --blue:#2f6fe0; --bluebg:#e8f0fe; --violet:#7a3fd1; --violetbg:#f1e9fd;
  --shadow:0 12px 40px rgba(25,15,10,.18); --r:14px;
  --ui:"Plus Jakarta Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0c0c; --pane:#161414; --pane2:#1b1918; --fg:#f2eeeb; --muted:#9c948e; --line:#2a2624; --hover:#221e1c;
  --brand:#ff5a12; --brand2:#33190b; --brandfg:#ff8a52; --ink:#000;
  --red:#ff7b70; --redbg:#3a1714; --amber:#f2b442; --amberbg:#352712; --green:#5fd391; --greenbg:#13301f; --blue:#86aefc; --bluebg:#18243d; --violet:#c09bff; --violetbg:#271d3a;
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0c0c; --pane:#161414; --pane2:#1b1918; --fg:#f2eeeb; --muted:#9c948e; --line:#2a2624; --hover:#221e1c;
  --brand:#ff5a12; --brand2:#33190b; --brandfg:#ff8a52; --ink:#000;
  --red:#ff7b70; --redbg:#3a1714; --amber:#f2b442; --amberbg:#352712; --green:#5fd391; --greenbg:#13301f; --blue:#86aefc; --bluebg:#18243d; --violet:#c09bff; --violetbg:#271d3a;
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.side{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

/* top bar */
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.logo img{height:28px;display:block}
.logo em{font-style:normal;color:var(--brand)}
.search{flex:1 1 260px;min-width:0;max-width:640px;margin-inline:auto;display:flex;align-items:center;gap:8px;background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:0 14px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;padding:8px 0}
.search input::placeholder{color:#ffffff99}
.tb{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative}
.ib:hover{background:#ffffff1a}
.dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px;color:#fff;padding:4px 10px 4px 4px;border-radius:999px}
.me:hover{background:#ffffff1a}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;position:relative}
.av.sm{width:22px;height:22px;font-size:9.5px}
.av .st{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:#22c55e}
.av .st.away{background:#f59e0b}

/* shell */
.shell{flex:1;min-height:0;display:flex}
.rail{width:64px;flex:none;background:var(--pane2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px}
.rail button{width:48px;padding:7px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);position:relative}
.rail button svg{width:20px;height:20px}
.rail button:hover{background:var(--hover);color:var(--fg)}
.rail button[aria-current="true"]{color:var(--brandfg);background:var(--brand2)}
.rail .n{position:absolute;top:2px;right:4px;background:var(--brand);color:#fff;font-size:9.5px;border-radius:8px;padding:0 5px;font-weight:700}

.folders{width:var(--wF,236px);flex:none;background:var(--pane2);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:14px}
.newmail{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;font-weight:700;border-radius:12px;padding:10px;box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 35%,transparent)}
.newmail:hover{filter:brightness(1.05)}
.newmail svg{width:18px;height:18px;flex:none}
.mpick{display:none;border:1px solid var(--line);background:var(--pane2);border-radius:10px;padding:7px 10px;font-weight:600}
.fab{display:none;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;font-size:24px;box-shadow:var(--shadow);z-index:20}
.fgroup{display:flex;flex-direction:column;gap:1px}
.fgroup h4{margin:0 0 4px;padding:0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.fi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--fg);text-align:left;width:100%}
.fi:hover{background:var(--hover)}
.fi[aria-current="true"]{background:var(--brand2);color:var(--brandfg);font-weight:700}
.fi .ic{width:18px;text-align:center;flex:none;opacity:.85}
.fi .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .c{font-size:12px;font-weight:700;color:var(--muted)}
.fi .c.hot{color:var(--brandfg)}
.ddot{width:9px;height:9px;border-radius:3px;flex:none}

/* list */
.list{width:var(--wL,400px);flex:none;background:var(--pane);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lhead{padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.lhead h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.lhead h2 small{font-size:12px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--pane2);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--pane);border-color:var(--fg)}
.chip .k{margin-left:4px;opacity:.75}
.msgs{flex:1;overflow-y:auto}
.day{padding:10px 16px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.m{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:11px 14px 11px 12px;border-left:3px solid transparent;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.m:hover{background:var(--hover)}
.m.open{background:var(--brand2);border-left-color:var(--brand)}
.m.unread{border-left-color:var(--brand)}
.m .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.m .r1{display:flex;gap:8px;align-items:baseline}
.m .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.m.unread .who,.m.unread .sub{font-weight:800}
.m .time{font-size:12px;color:var(--muted);white-space:nowrap}
.m.unread .time{color:var(--brandfg);font-weight:700}
.m .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.m .pre{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--muted)}
.m .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center}
.qa{position:absolute;right:10px;top:8px;display:none;gap:2px;background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.m:hover .qa{display:flex}
.qa button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px}
.qa button:hover{background:var(--hover)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-new{background:var(--bluebg);color:var(--blue)}.t-asg{background:var(--pane2);color:var(--muted);border:1px solid var(--line)}
.t-prom{background:var(--amberbg);color:var(--amber)}.t-late{background:var(--redbg);color:var(--red)}.t-done{background:var(--greenbg);color:var(--green)}
.t-xfer{background:var(--violetbg);color:var(--violet)}.t-flag{color:var(--red);font-size:13px}
.empty{padding:60px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{font-size:16px;color:var(--fg)}

/* reader */
.read{flex:1;min-width:0;background:var(--pane);display:flex;flex-direction:column;min-height:0}
.rtop{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.rtop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.rtitle{display:flex;gap:10px;align-items:flex-start}
.rtitle h1{flex:1;min-width:0}
.back{display:none;width:34px;height:34px;border-radius:10px;background:var(--pane2);flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;font-weight:600;font-size:13px;background:var(--pane2);border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.vio{background:var(--violetbg);color:var(--violet);border-color:transparent}
.btn.ok{background:var(--greenbg);color:var(--green);border-color:transparent}
.track{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--pane2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:13px}
.track .k{color:var(--muted);font-size:12px;font-weight:600}
.track select{background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:190px}
.track .sp{width:1px;height:20px;background:var(--line)}
.rbody{position:relative;flex:1;overflow-y:auto;padding:16px 22px 24px;display:flex;flex-direction:column;gap:14px}
.promise{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--amberbg);border-radius:var(--r);padding:10px 12px}
.promise.late{background:var(--redbg)}
.promise b{flex:1 1 200px;min-width:0}
.promise .sub{font-size:12px;color:var(--muted)}
.mail{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mail header{display:flex;gap:10px;align-items:center}
.mail header .w{flex:1;min-width:0}
.mail header .w b{display:block}
.mail header .w span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mail header time{font-size:12px;color:var(--muted);white-space:nowrap}
.mail p{margin:0;white-space:pre-wrap;line-height:1.6}
.att{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;width:fit-content}
.inline{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.inline .to{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.inline textarea{border:0;outline:none;resize:vertical;min-height:90px;padding:10px 12px;background:var(--pane);line-height:1.5}
.inline footer{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--pane2);border-top:1px solid var(--line)}
.inline footer .grow{flex:1}
.inline input[type=text],.inline input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--pane);min-width:0}
.hist{display:flex;flex-direction:column;gap:0;padding-left:6px}
.hist h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hi{display:flex;gap:10px;font-size:12.5px;padding-bottom:10px;position:relative}
.hi::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:4px;flex:none;box-shadow:0 0 0 3px var(--pane)}
.hi.h-r::before{background:var(--brand)}.hi.h-x::before{background:var(--violet)}.hi.h-a::before{background:var(--blue)}.hi.h-d::before{background:var(--green)}.hi.h-p::before{background:var(--amber)}
.hi span{color:var(--muted)}
.hi>div{min-width:0;flex:1;overflow-wrap:anywhere}
.rbody>*,.page>*,.folders>*,.dlg .body>*{flex-shrink:0}
.blank{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
.blank img{height:56px;opacity:.9;margin:0 auto 12px;display:block;border-radius:10px}

/* pages (people, tasks, etc.) */
.page{flex:1;min-width:0;overflow-y:auto;background:var(--pane);padding:22px clamp(16px,3vw,32px) 40px;display:flex;flex-direction:column;gap:18px}
.page h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.page .lead{color:var(--muted);margin:-10px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--pane)}
.card h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.person{display:flex;gap:10px;align-items:center}
.person .w{flex:1;min-width:0}
.person .w b{display:block;font-size:13.5px}
.person .w span{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.task .w{min-width:0}
.task .w b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .w span{font-size:12px;color:var(--muted)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.tick:hover{border-color:var(--green);background:var(--greenbg)}
.feed{display:flex;flex-direction:column;gap:10px;max-width:760px}
.post{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.post span{font-size:12px;color:var(--muted)}
.post p{margin:0}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.45);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.dlg{background:var(--pane);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(760px,100%)}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0;font-size:16px;flex:1}
.dlg .body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{width:32px;height:32px;border-radius:10px;background:var(--pane2)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.dlg input[type=text],.dlg input[type=email],.dlg input[type=date],.dlg select,.dlg textarea{border:1px solid var(--line);background:var(--pane2);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box;min-width:0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dpick{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.dpick[aria-pressed="true"]{border-color:var(--violet);background:var(--violetbg)}
.dpick span{font-size:11.5px;color:var(--muted)}
.ai{display:flex;gap:6px}
.ai input{flex:1}
.editor{border:1px solid var(--line);border-radius:12px;min-height:170px;padding:10px 12px;line-height:1.55;outline:none;background:var(--pane)}
.pop{position:fixed;top:58px;right:12px;width:min(370px,calc(100% - 24px));background:var(--pane);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:40;max-height:72%;display:flex;flex-direction:column;overflow:hidden}
.pop header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop ul{list-style:none;margin:0;padding:0;overflow:auto}
.pop li{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:13px}
.pop li.un{background:var(--brand2)}
.pop li small{color:var(--muted)}
.menu button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.menu button:hover{background:var(--hover)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--pane);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow);margin-bottom:env(safe-area-inset-bottom,0px)}
.mobnav{display:none}
[hidden]{display:none!important}

/* signature block */
.sig{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:12.5px;color:var(--muted);white-space:pre-wrap;line-height:1.5}
.sig.ours{border-left-color:var(--brand)}
.sig small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:2px}
.via{display:inline-block;font-size:11px;font-weight:700;background:var(--brand2);color:var(--brandfg);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
/* dashboard */
.mbx{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff;background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:5px 10px;white-space:nowrap}
.mbx span{font-weight:500;opacity:.75}
@media (max-width:1100px){.mbx{display:none}}
body.signedout>header,body.signedout>.shell,body.signedout>.mobnav,body.signedout>.fab{visibility:hidden}
#login{position:fixed;inset:0;z-index:90;overflow:auto;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--brand) 22%,transparent),transparent),var(--ink);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lgwrap{min-height:100%;display:grid;place-items:center}
.lgcard{width:min(440px,100%);background:var(--pane);border-radius:20px;padding:28px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.lglogo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.lglogo img{height:34px;border-radius:6px}
.lglogo em{font-style:normal;color:var(--brand)}
.lgcard h1{margin:6px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.lgsub{margin:-6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.lgcard input{border:1px solid var(--line);background:var(--pane2);border-radius:12px;padding:11px 12px;width:100%;box-sizing:border-box}
.lgbtn{justify-content:center;padding:11px;font-size:15px;border-radius:12px}
.lgerr{margin:0;color:var(--red);font-size:13px;font-weight:600}
.lgdemo{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.lgdemo>span{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lgdemo>div{display:flex;gap:6px;flex-wrap:wrap}

  const cc=Object.entries(COUNTRY).find(([k,v])=>l.toLowerCase().endsWith(v.toLowerCase()));if(cc){o.code=cc[0];o.country=cc[1];o.city=l.split(',')[0].trim();return}

function classify(t){const txt=(t.sub+' '+t.pre+' '+(t.msgs[0]?.body||'')).toLowerCase();let best=null,hits=0;
 for(const id of ORDER){const m=txt.match(new RegExp(LB(id).kw.source,'gi'));if(m&&m.length>hits){best=id;hits=m.length}}

 return{id:best,conf:Math.min(97,72+hits*9)}}

/* the mail trail: every earlier mail in the conversation, newest first, as Outlook quotes it */
function trailOf(t,upto){const ms=t.msgs.slice(0,upto==null?t.msgs.length:upto);return ms.map(m=>({from:m.from,email:m.email,at:m.at,to:m.by?t.email:dept(t.dept).box+'rugscreation.com',sub:cleanSub(t.sub),body:m.body,sig:m.sig}))}
function trailHTML(tr,open){if(!tr||!tr.length)return'';return `<details class="trail" ${open?'open':''}><summary>Mail trail · ${tr.length} earlier mail${tr.length>1?'s':''} · oldest first</summary><div class="q">${tr.map((q,i)=>`<div><div class="qh"><span class="qn">${i+1}</span><b>From:</b> ${esc(q.from)} &lt;${esc(q.email)}&gt;<br><b>Sent:</b> ${tLong(q.at)}<br><b>To:</b> ${esc(q.to)}<br><b>Subject:</b> ${esc(q.sub)}</div><div class="qb">${esc(q.body)}${q.sig?'\n\n'+esc(q.sig):''}</div></div>`).join('')}</div></details>`}
function sendReply(t,txt,p,dv,fwd,noTrail,html,withSig=true){
 const tr=noTrail?[]:trailOf(t);t.msgs.push({from:who(ME).name,by:ME,email:dept(t.dept).box+'rugscreation.com',at:Date.now(),body:txt,html:html||'',sig:withSig?sigOf(ME):'',trail:tr,fwd:!!fwd});t.last=Date.now();
 if(!t.owner&&t.dept===who(ME).dept){t.owner=ME;if(t.status==='new')t.status='open'}
 if(p&&dv){t.promise=p;t.due=new Date(dv+'T17:00').getTime();t.status='promised';hist(t,'p',`Promise: ${p} — ${dShort(t.due)}`)}
 (openMsgs[t.id]=openMsgs[t.id]||new Set()).add(t.msgs.length-1);save();if(typeof liveSend==='function')liveSend(t,t.msgs[t.msgs.length-1],fwd);toast(p?'Sent · reminder set 🤝':'Sent ✓');render()}

  try{const r=await api('login',{login:raw.includes('@')?raw:raw+'@'+DOMAIN,password:pw});TOKEN=r.token;try{localStorage.setItem('rugs-token',TOKEN)}catch(e){}await enterApp(r);toast('Signed in as '+r.me.name)}
  catch(e){err.hidden=false;err.textContent=e.message;bt.disabled=false;bt.textContent='Sign in';$('#lgP').select()}};
 $('#lgGo').onclick=go;['lgE','lgP'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}}));
 setTimeout(()=>$('#lgE')?.focus(),50)}
function signIn(pid){ME=pid;S.session=pid;save();dashAs='';app='dash';adminTab='overview';openId=null;lfilt='';filt='all';view={type:'box',dept:who(ME).dept,folder:'inbox'};
 $('#login').hidden=true;$('#login').innerHTML='';document.body.classList.remove('signedout');render();toast(`Signed in as ${who(ME).name}`)}
function signOut(){api('logout').catch(()=>{}).finally(()=>sessionEnd(''))}
/* ---------- LIVE: Rugs Email server (Supabase) · Gmail through Google Workspace ---------- */
let metaSaved={},lastList=0,polling=false,pollT=null,AI_ON=false;
const KIND={send:'s',forward:'s',reopen:'a',assign:'a',transfer:'x',promise:'p',done:'d',note:'n'};
const boxDept=()=>{const m={};DEPTS.forEach(d=>m[mailOf(d).toLowerCase()]=d.id);return m};
const gidOf=t=>String(t.id).slice(String(t.id).indexOf(':')+1);
const isOther=e=>/no-?reply|newsletter|notifications?@|mailer-daemon|updates@|alerts?@|news@|digest@|promo/i.test(e||'');
function sigFromText(b){const L=(b||'').split(/\r?\n/);let k=-1;for(let i=L.length-1;i>=Math.max(0,L.length-30);i--){if(/^(best|kind|warm)?\s*regards|^thanks|^thank you|^--\s*$|^cheers/i.test(L[i].trim())){k=i;break}}return k<0?'':L.slice(k+1,k+9).map(x=>x.trim()).filter(Boolean).join('\n')}
function avgReply(inS){const ts=S.threads.filter(t=>inS(t)&&t.firstReply&&NOW-t.last<30*D);if(!ts.length)return'—';
 const hrs=ts.map(t=>{const fi=t.msgs.find(m=>!m.ours);return fi?Math.max(0,(t.firstReply-fi.at)/H):null}).filter(x=>x!=null);if(!hrs.length)return'—';
 const a=hrs.reduce((x,y)=>x+y,0)/hrs.length;return a<1?Math.round(a*60)+'m':a<48?a.toFixed(1)+'h':Math.round(a/24)+'d'}
function boxStatusHTML(){const b=S.boxes||[];if(!b.length)return'';
 return `<section class="box" style="margin-bottom:12px"><h3>Google Workspace connection <span>mail sync</span></h3>${b.map(x=>{const c=x.status==='live'?'var(--green)':x.status==='error'?'var(--red)':'var(--amber)',l=x.status==='live'?'Live':x.status==='backfilling'?'Loading older mail…':x.status==='error'?'Problem':'Waiting for first sync';
  return `<div class="prow"><span class="nm"><span class="ddot" style="background:${c}"></span>${esc(x.mailbox)}</span><span class="vv">${l} · last sync ${x.last_sync?tShort(Date.parse(x.last_sync)):'never'}${x.status==='error'?' · '+esc(x.note||''):''}</span></div>`}).join('')}</section>`}

/* server rows → the app's org */
function applyBoot(b){
 S.org={depts:b.depts.map(d=>({id:d.id,name:d.name,box:String(d.mailbox).replace(/@.*$/,'@'),color:d.color||'#ff5001'})),
  people:b.users.map(u=>({id:u.id,name:u.name,dept:u.dept_id,role:u.role,login:u.login,active:u.active!==false,perm:u.perm||{},access:u.access||{},hasPw:!!u.has_password}))};
 applyOrg();
 S.profiles={};S.sigs={};S.leaves={};
 b.users.forEach(u=>{if(u.profile&&Object.keys(u.profile).length)S.profiles[u.id]=u.profile;if(u.signature)S.sigs[u.id]=u.signature;S.leaves[u.id]=!!u.on_leave});
 S.circulars=Array.isArray(b.settings?.circulars)?b.settings.circulars:[];S.folders=Array.isArray(b.settings?.folders)?b.settings.folders:[];
 metaSaved.__circ=JSON.stringify(S.circulars);metaSaved.__fold=JSON.stringify(S.folders);AI_ON=!!b.ai}

/* server rows → the app's thread objects */
function mapRow(r,ms,acts,old,home){
 const msgs=ms.map(m=>{const out=m.direction==='out',by=out&&m.sent_by&&who(m.sent_by)?m.sent_by:'',prev=old?.msgs.find(x=>x.gid===m.gmail_id);
  return{gid:m.gmail_id,from:out?(by?who(by).name:'Team mailbox'):(m.from_name||m.from_email),email:m.from_email,at:Date.parse(m.sent_at),body:(prev?.full?prev.body:(m.body_text||'')).trim(),raw:prev?.raw||'',full:!!prev?.full,sig:out?'':sigFromText(m.body_text),by,ours:out,to:m.to_text,cc:m.cc_text,atts:m.attachments||[],files:m.drive_status==='done'?(m.drive_files||[]):null}});
 const hist=acts.filter(a=>a.kind!=='send').map(a=>({t:KIND[a.kind]||a.kind||'n',txt:a.text,at:Date.parse(a.at)}));
 const att=(ms.flatMap(m=>m.attachments||[])[0]||{}).name||'';
 const t={id:home+':'+r.gmail_thread_id,box:r.mailbox,dept:r.dept_id||home,from:r.counterpart_name||r.counterpart_email||'(unknown)',email:r.counterpart_email||'',
  sub:r.subject||'(no subject)',pre:(r.snippet||'').slice(0,160),last:Date.parse(r.last_msg_at)||Date.now(),unread:!!r.unread,flag:!!r.flagged,owner:r.owner_id||'',
  status:r.status||(r.owner_id?'open':'new'),promise:r.promise||'',due:r.due_at?Date.parse(r.due_at):null,folder:r.folder||'inbox',prev:r.prev_folder||'',
  other:isOther(r.counterpart_email),att,label:r.topic||'',ai:r.topic_ai!==false,conf:r.topic_conf||0,msgs,hist,_hn:hist.length,full:false,cc:'',
  firstReply:r.first_reply_at?Date.parse(r.first_reply_at):null,doneAt:r.done_at?Date.parse(r.done_at):null};
 if(!r.topic&&!r.topic_checked){const c=classify(t);t.label=c?c.id:'';t.ai=true;t.conf=c?c.conf:0}
 if(old&&old.full&&msgs.every(m=>m.full))t.full=true;
 return t}
/* attachments: copied into the department's Google Drive (folder per buyer) */
const fsize=b=>!b?'':b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1)+' MB';
function attHTML(m){const f=(m.files||[]).filter(x=>x.name);
 if(f.length)return `<div style="display:flex;gap:6px;flex-wrap:wrap">${f.map(x=>x.link?`<a class="att" href="${esc(x.link)}" target="_blank" rel="noopener" title="Open in Google Drive">📎 ${esc(x.name)} <small style="color:var(--muted)">${fsize(x.size)} · Drive ↗</small></a>`:`<span class="att" title="${x.big?'Too big for automatic copy — open it in Gmail':'Not copied'}">📎 ${esc(x.name)} <small style="color:var(--muted)">${fsize(x.size)}${x.big?' · in Gmail':''}</small></span>`).join('')}</div>`;
 const p=(m.atts||[]).filter(x=>!(/^image\//i.test(x.mime||'')&&(x.size||0)<40000));
 return p.length?`<div style="display:flex;gap:6px;flex-wrap:wrap">${p.map(x=>`<span class="att" title="Being saved to Google Drive…">📎 ${esc(x.name)} <small style="color:var(--muted)">${fsize(x.size)} · saving to Drive…</small></span>`).join('')}</div>`:''}
const metaOf=t=>{const o={dept_id:t.dept,owner_id:t.owner||null,status:t.status,promise:t.promise||null,due_at:t.due?new Date(t.due).toISOString():null,flagged:!!t.flag,folder:t.folder,prev_folder:t.prev||null,unread:!!t.unread};if(t.ai===false){o.topic=t.label||null;o.topic_ai=false}return o};

/* load threads: full = everything, otherwise only what changed since the last call */
async function loadList(full){const r=await api('list',full?{}:{since:lastList});lastList=r.now;S.boxes=r.mailboxes||[];
 const by={},ac={};r.messages.forEach(m=>{const k=m.mailbox+'|'+m.gmail_thread_id;(by[k]=by[k]||[]).push(m)});r.activity.forEach(a=>{const k=a.mailbox+'|'+a.gmail_thread_id;(ac[k]=ac[k]||[]).push(a)});
 const bd=boxDept();let newMail=0,changed=0;
 if(full)S.threads=S.threads.filter(t=>t._local);
 r.threads.forEach(row=>{const home=bd[String(row.mailbox).toLowerCase()];if(!home)return;const id=home+':'+row.gmail_thread_id;
  const ex=S.threads.findIndex(t=>t.id===id),old=ex>=0?S.threads[ex]:null;
  if(old&&(metaSaved[id]!==JSON.stringify(metaOf(old))||(old.hist.length>(old._hn||0))))return;   // my change is still saving
  const k=row.mailbox+'|'+row.gmail_thread_id,t=mapRow(row,by[k]||[],ac[k]||[],old,home);if(!t.msgs.length)return;
  const ins=x=>x?x.msgs.filter(m=>!m.ours).length:0;
  if(!full&&ins(t)>ins(old))newMail++;
  if(old){S.threads[ex]=t;if(openMsgs[id]&&t.msgs.length>old.msgs.length)openMsgs[id].add(t.msgs.length-1)}else S.threads.push(t);
  metaSaved[id]=JSON.stringify(metaOf(t));changed++});
 return{newMail,changed}}

/* save tracking changes (owner, status, promise, topic, folder, flag, read, transfer) + new activity */
let flushT;function liveFlush(){if(!window.__liveReady)return;clearTimeout(flushT);flushT=setTimeout(flushNow,600)}
function flushNow(){const ch=[];
 S.threads.forEach(t=>{if(t._local)return;const j=JSON.stringify(metaOf(t)),newH=t.hist.slice(t._hn||0);if(metaSaved[t.id]===j&&!newH.length)return;
  const old=metaSaved[t.id]?JSON.parse(metaSaved[t.id]):{},m=metaOf(t),patch={};for(const k in m)if(JSON.stringify(m[k])!==JSON.stringify(old[k]))patch[k]=m[k];
  ch.push({mailbox:t.box,threadId:gidOf(t),patch,log:newH.map(h=>({kind:h.t,text:h.txt}))});metaSaved[t.id]=j;t._hn=t.hist.length});
 if(ch.length)api('meta',{changes:ch}).catch(e=>{toast('Not saved: '+e.message);loadList(true).then(render).catch(()=>{})});
 const c=JSON.stringify(S.circulars||[]);if(c!==metaSaved.__circ){metaSaved.__circ=c;api('saveSetting',{key:'circulars',value:S.circulars}).catch(()=>{})}
 const f=JSON.stringify(S.folders||[]);if(f!==metaSaved.__fold){metaSaved.__fold=f;api('saveSetting',{key:'folders',value:S.folders}).catch(()=>{})}}

/* admin: departments, people, access → server (passwords are separate: setPassword) */
function liveSaveOrg(){return api('saveOrg',{org:{depts:DEPTS.map(d=>({id:d.id,name:d.name,mailbox:mailOf(d),color:d.color})),people:PEOPLE.map(p=>({id:p.id,name:p.name,login:p.login,dept_id:p.dept,role:p.role,active:p.active,perm:p.perm,access:p.access}))}})
 .then(b=>{applyBoot(b);render();return b}).catch(e=>{toast(e.message);api('boot').then(b=>{applyBoot(b);render()}).catch(()=>{});throw e})}

/* open: fetch the full original (HTML exactly as received) */
async function liveOpen(t){if(t.full||t._local)return;try{const r=await api('thread',{mailbox:t.box,threadId:gidOf(t)});
 r.messages.forEach(m=>{const x=t.msgs.find(y=>y.gid===m.gmail_id);if(!x)return;x.raw=m.body_html||'';x.body=(m.body_text||x.body||'').trim();x.full=true;if(!x.ours)x.sig=sigFromText(m.body_text)});
 t.full=true;if(openId===t.id&&!(document.activeElement&&document.activeElement.id==='qr'))renderRead()}catch(e){toast('Could not open: '+e.message)}}

function outgoingHTML(m){const sig=m.sig?`<div style="margin-top:14px;color:#444;white-space:pre-wrap;font-size:13px">${esc(m.sig)}</div>`:'';
 const tr=(m.trail||[]).map(q=>`<div style="border-top:1px solid #ccc;margin-top:14px;padding-top:8px;font-size:13px;color:#333"><b>From:</b> ${esc(q.from)} &lt;${esc(q.email)}&gt;<br><b>Sent:</b> ${esc(tLong(q.at))}<br><b>To:</b> ${esc(q.to)}<br><b>Subject:</b> ${esc(q.sub)}<br><br>${esc(q.body).replace(/\n/g,'<br>')}${q.sig?'<br><br>'+esc(q.sig).replace(/\n/g,'<br>'):''}</div>`).join('');
 return `<div style="font-family:Calibri,Arial,sans-serif;font-size:15px">${m.html||esc(m.body).replace(/\n/g,'<br>')}${sig}${tr}</div>`}

/* send / reply / forward from the department mailbox, with the person's name + signature */
function liveSend(t,m,fwd,isNew){const box=isNew?mailOf(dept(t.dept)):t.box,localId=t.id;m.sending=true;
 api('send',{mailbox:box,threadId:isNew?'':gidOf(t),to:fwd?(t._fwdTo||''):t.email,cc:t.cc||'',subject:t.sub,html:outgoingHTML(m),text:m.body,forward:!!fwd})
 .then(async r=>{m.sending=false;m.gid=r.messageId;toast('Delivered ✓');
  if(isNew){S.threads=S.threads.filter(x=>x!==t);await loadList(false);const nid=boxDept()[box.toLowerCase()]+':'+r.threadId;if(openId===localId)openId=nid}
  else await loadList(false);render()})
 .catch(e=>{m.sending=false;m.failed=true;toast('Not sent: '+e.message);if(isNew){t.hist.push({t:'n',txt:'Not sent: '+e.message,at:Date.now()})}render()})}

async function liveSync(){const r=await api('sync',{force:true});const err=r.find(x=>x.error);if(err)toast(err.mailbox+': '+err.error);
 const{newMail}=await loadList(false);ensureLabels();return newMail}

async function poll(){if(polling||syncing||document.hidden||!window.__liveReady)return;polling=true;
 try{const{newMail,changed}=await loadList(false);if(!changed)return;ensureLabels();
  if(newMail){S.notifs.unshift({t:`📥 ${newMail} new mail`,at:Date.now(),read:false});toast(`📥 ${newMail} new mail`);save()}
  const busy=$('#layer').innerHTML||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')||document.activeElement?.isContentEditable;
  if(busy){renderTop();if(app==='mail')renderList()}else render()}
 catch(e){}finally{polling=false}}

function sessionEnd(msg){TOKEN='';try{localStorage.removeItem('rugs-token')}catch(e){}window.__liveReady=false;clearInterval(pollT);S.threads=[];metaSaved={};$('#layer').innerHTML='';showLogin(msg||'')}

async function enterApp(b){applyBoot(b);const me=who(b.me.id);if(!me){sessionEnd('Your user is not set up. Ask the admin.');return}
 ME=me.id;S.session=ME;dashAs='';app='dash';adminTab='overview';openId=null;lfilt='';filt='all';view={type:'box',dept:me.dept,folder:'inbox'};
 $('#login').hidden=true;$('#login').innerHTML='';document.body.classList.remove('signedout');S.threads=[];window.__liveReady=true;render();
 try{await loadList(true);ensureLabels();S.lastSync=Date.now();render()}catch(e){toast('Could not load mail: '+e.message)}
 clearInterval(pollT);pollT=setInterval(poll,30000);
 if(!S.threads.length)syncNow()}

function liveStart(){document.body.classList.add('signedout');const L=$('#login');
 if(!TOKEN){showLogin();return}
 L.hidden=false;L.innerHTML=`<div class="lgwrap"><div class="lgcard"><div class="lglogo"><img src="${LOGO}" alt="Rugs Creation"><span>Rugs <em>Email</em></span></div><h1>Connecting…</h1><p class="lgsub">Opening your mailbox.</p></div></div>`;
 api('boot').then(enterApp).catch(e=>{TOKEN='';try{localStorage.removeItem('rugs-token')}catch(x){}showLogin(/session|sign in/i.test(e.message)?'':e.message)})}
/* ---------- Admin: import everyone from Google Workspace in one go ---------- */
function dirImport(){const L=dlg('Import people from Google',`<p class="lead" style="margin:0">Loading the staff list from Google Workspace…</p>`,`<button class="btn" data-c>Close</button>`,true);L.querySelector('[data-c]').onclick=()=>L.innerHTML='';
 api('dirUsers').then(r=>{const have=new Set(PEOPLE.map(p=>p.login)),boxes=new Set(DEPTS.map(d=>mailOf(d).toLowerCase()));
  const rows=r.users.filter(u=>!u.suspended&&!have.has(u.email));
  if(!rows.length){L.querySelector('.body').innerHTML=`<div class="empty"><b>Everyone is already added ✓</b><span>${r.users.length} Google accounts checked.</span></div>`;return}
  const dOpt=sel=>DEPTS.map(d=>`<option value="${d.id}" ${sel===d.id?'selected':''}>${esc(d.name)}</option>`).join('');
  const rOpt=ROLES.filter(x=>x!=='Admin').map(x=>`<option ${x==='Executive'?'selected':''}>${x}</option>`).join('');
  L.querySelector('.body').innerHTML=`<p class="lead" style="margin:0">${rows.length} people in Google are not in Rugs Email yet. Tick who should get access, pick their department and role, then import. Department mailboxes are left unticked.</p>
  <div class="setform" style="margin:0"><input type="text" id="diQ" placeholder="Search name or email"><span style="font-size:12.5px;color:var(--muted)">Set for all ticked:</span><select id="diD"><option value="">Department…</option>${dOpt('')}</select><select id="diR"><option value="">Role…</option>${rOpt.replace(' selected','')}</select></div>
  <div class="atable" style="max-height:52vh;overflow:auto"><table><thead><tr><th class="c"><input type="checkbox" id="diAll" aria-label="Tick all"></th><th>Name</th><th>User ID</th><th>In Google</th><th>Department</th><th>Role</th></tr></thead><tbody>
  ${rows.map((u,i)=>`<tr data-di="${i}"><td class="c"><input type="checkbox" class="diK" ${boxes.has(u.email)?'':'checked'} aria-label="Import ${esc(u.name)}"></td><td><input type="text" class="diN" value="${esc(u.name)}" aria-label="Name"></td><td>${esc(u.email)}</td><td><small class="dim2">${esc([u.title,u.department,u.ou!=='/'?u.ou:''].filter(Boolean).join(' · ')||'—')}</small></td><td><select class="diDe">${dOpt(DEPTS[0]?.id)}</select></td><td><select class="diRo">${rOpt}</select></td></tr>`).join('')}
  </tbody></table></div>
  <label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="diPw" checked> Create a password for each person now (shown once, so you can copy and share it)</label>`;
  L.querySelector('footer').innerHTML=`<button class="btn" data-c>Cancel</button><button class="btn pri" data-imp>⇩ Import ticked people</button>`;
  L.querySelector('[data-c]').onclick=()=>L.innerHTML='';
  const trs=()=>[...L.querySelectorAll('tr[data-di]')];
  L.querySelector('#diQ').oninput=e=>{const q=e.target.value.toLowerCase();trs().forEach(tr=>{const u=rows[+tr.dataset.di];tr.hidden=!!q&&!(u.name+' '+u.email).toLowerCase().includes(q)})};
  L.querySelector('#diAll').onchange=e=>trs().forEach(tr=>{if(!tr.hidden)tr.querySelector('.diK').checked=e.target.checked});
  L.querySelector('#diD').onchange=e=>{if(e.target.value)trs().forEach(tr=>{if(tr.querySelector('.diK').checked)tr.querySelector('.diDe').value=e.target.value})};
  L.querySelector('#diR').onchange=e=>{if(e.target.value)trs().forEach(tr=>{if(tr.querySelector('.diK').checked)tr.querySelector('.diRo').value=e.target.value})};
  L.querySelector('[data-imp]').onclick=async()=>{const pick=trs().filter(tr=>tr.querySelector('.diK').checked);if(!pick.length){toast('Tick at least one person');return}
   const withPw=L.querySelector('#diPw').checked,made=[],bt=L.querySelector('[data-imp]');bt.disabled=true;bt.textContent='Importing…';
   pick.forEach((tr,k)=>{const u=rows[+tr.dataset.di],role=tr.querySelector('.diRo').value,id='u'+Date.now().toString(36)+k;
    PEOPLE.push({id,name:tr.querySelector('.diN').value.trim()||u.name,dept:tr.querySelector('.diDe').value,role,login:u.email,active:true,perm:{...(ROLE_PERM[role]||ROLE_PERM.Executive)},access:{},hasPw:false});made.push({id,name:tr.querySelector('.diN').value.trim()||u.name,login:u.email,password:withPw?genPw():''})});
   try{await liveSaveOrg();
    if(withPw){await api('setPasswords',{list:made.map(m=>({id:m.id,password:m.password}))});made.forEach(m=>{const p=who(m.id);if(p)p.hasPw=true})}
    const txt=['Name\tUser ID\tPassword',...made.map(m=>[m.name,m.login,m.password||'(not set)'].join('\t'))].join('\n');
    L.querySelector('.body').innerHTML=`<div class="promise"><span>✓</span><b>${made.length} people imported<br><span class="sub">${withPw?'Copy these passwords now and share each one privately — they are not shown again.':'Set their passwords with 🔑 Password in Users.'}</span></b></div>
     ${withPw?`<div class="atable" style="max-height:50vh;overflow:auto"><table><thead><tr><th>Name</th><th>User ID</th><th>Password</th></tr></thead><tbody>${made.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.login)}</td><td><code>${esc(m.password)}</code></td></tr>`).join('')}</tbody></table></div>`:''}`;
    L.querySelector('footer').innerHTML=`${withPw?'<button class="btn" data-cp>⧉ Copy all for Excel</button>':''}<button class="btn pri" data-c>Done</button>`;
    L.querySelector('[data-c]').onclick=()=>{L.innerHTML='';render()};
    const cp=L.querySelector('[data-cp]');if(cp)cp.onclick=()=>navigator.clipboard.writeText(txt).then(()=>toast('Copied — paste into Excel')).catch(()=>toast('Select the table and copy it'))}
   catch(e){bt.disabled=false;bt.textContent='⇩ Import ticked people';toast('Import failed: '+e.message)}}})
 .catch(e=>{L.querySelector('.body').innerHTML=`<div class="promise late"><span>⚠️</span><b>Could not read the Google staff list<br><span class="sub">${esc(e.message)}</span></b></div>`})}
document.addEventListener('click',e=>{if(e.target.closest('[data-dirimp]')){e.preventDefault();dirImport()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
liveStart();

</script>
